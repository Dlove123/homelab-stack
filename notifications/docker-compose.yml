# Notifications Stack - ntfy + Gotify + Apprise
version: '3.8'

services:
  ntfy:
    image: binwiederhier/ntfy
    ports:
      - "8080:80"
    command: serve
    restart: unless-stopped

  gotify:
    image: gotify/server
    ports:
      - "8081:80"
    environment:
      GOTIFY_DEFAULTUSER_NAME: admin
      GOTIFY_DEFAULTUSER_PASS: admin123
    volumes:
      - gotify_data:/app/data
    restart: unless-stopped

  apprise:
    image: caronc/apprise
    ports:
      - "8000:8000"
    volumes:
      - ./apprise_config:/config
    restart: unless-stopped

volumes:
  gotify_data:
